# Default: Zabbix 7.4 on :8089. Another version side by side, e.g. the 8.0 dev branch:
#   ZABBIX_TAG=alpine-trunk ZABBIX_WEB_PORT=8090 ZABBIX_SERVER_PORT=10152 \
#     docker compose -p zabbix-node-test-trunk -f test/docker-compose.zabbix.yml up -d
name: zabbix-node-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_test_pw
      POSTGRES_DB: zabbix
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zabbix']
      interval: 5s
      timeout: 3s
      retries: 20

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_TAG:-alpine-7.4-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_test_pw
      POSTGRES_DB: zabbix
    ports:
      - '${ZABBIX_SERVER_PORT:-10151}:10051'

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_TAG:-alpine-7.4-latest}
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_test_pw
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - '${ZABBIX_WEB_PORT:-8089}:8080'
